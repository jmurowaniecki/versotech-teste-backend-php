[www]
user = laravel
group = laravel
listen = 9000

pm = dynamic
pm.max_children = 30
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 300
pm.process_idle_timeout = 10s

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

request_terminate_timeout = 60s
security.limit_extensions = .php
